<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13203F"/>
      <stop offset="1" stop-color="#0A1228"/>
    </linearGradient>
    <linearGradient id="glowm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BA3FF"/>
      <stop offset="1" stop-color="#9D8DFF"/>
    </linearGradient>
    <radialGradient id="stagem" cx="0.5" cy="0.78" r="0.45">
      <stop offset="0" stop-color="#5BA3FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#5BA3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background (maskable safe zone is the inner 80%) -->
  <rect width="512" height="512" fill="url(#bgm)"/>
  <rect width="512" height="512" fill="url(#stagem)"/>

  <!-- Crowd (kept inside the safe zone) -->
  <g fill="#0A1228" opacity="0.85">
    <circle cx="120" cy="372" r="28"/>
    <circle cx="184" cy="372" r="28"/>
    <circle cx="248" cy="372" r="28"/>
    <circle cx="312" cy="372" r="28"/>
    <circle cx="376" cy="372" r="28"/>
    <rect x="92" y="372" width="328" height="68"/>
  </g>

  <!-- Raised arms -->
  <g stroke="url(#glowm)" stroke-width="6" stroke-linecap="round" opacity="0.75">
    <line x1="120" y1="344" x2="116" y2="288"/>
    <line x1="248" y1="344" x2="244" y2="278"/>
    <line x1="376" y1="344" x2="380" y2="282"/>
  </g>

  <!-- Music note -->
  <g fill="url(#glowm)">
    <rect x="232" y="170" width="12" height="148" rx="6"/>
    <path d="M244 170 C 294 188, 294 232, 264 254 C 290 234, 276 200, 244 188 Z"/>
    <ellipse cx="212" cy="320" rx="34" ry="26" transform="rotate(-22 212 320)"/>
  </g>
</svg>
